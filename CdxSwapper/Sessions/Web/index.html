<!doctype html>
<html lang="__LANG__" data-locale="__LOCALE__" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="session-token" content="__TOKEN__">
  <title>CdxSwapper</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div class="brand"><span class="logo">C/</span><div><b>CdxSwapper</b><small data-i18n="library"></small></div></div>
    <div class="top-actions"><span class="live" data-i18n="local"></span><select id="theme" data-i18n-aria="theme"><option value="dark">Dark</option><option value="light">Light</option><option value="hyper">Hyper</option><option value="graphite">Graphite</option></select><label><input id="auto" type="checkbox" checked> <span data-i18n="auto"></span></label><button id="refresh" data-i18n="refresh"></button></div></header>
  <main>
    <aside>
      <div class="heading"><h1 data-i18n="sessions"></h1><span id="count">…</span></div>
      <input id="search" type="search" data-i18n-placeholder="contentPlaceholder" data-i18n-aria="search">
      <div class="search-options"><label><input id="content-search" type="checkbox" checked> <span data-i18n="contentSearch"></span></label><span id="index-status" data-i18n="indexWaiting"></span></div>
      <nav id="providers"><button data-provider="all" class="active" data-i18n="all"></button><button data-provider="codex">Codex <span id="codex-count"></span></button><button data-provider="claude">Claude <span id="claude-count"></span></button><button data-provider="hermes">Hermes <span id="hermes-count"></span></button><button data-provider="antigravity">Gemini <span id="antigravity-count"></span></button></nav>
      <div class="filters"><select id="status" data-i18n-aria="status"><option value="all" data-i18n="allStatuses"></option><option value="active" data-i18n="active"></option><option value="archived" data-i18n="archive"></option></select><label><input id="agents" type="checkbox"> <span data-i18n="subagents"></span></label><select id="sort" data-i18n-aria="sort"><option value="recent" data-i18n="newest"></option><option value="old" data-i18n="oldest"></option><option value="title" data-i18n="byTitle"></option></select></div>
      <div id="list" class="session-list"><div class="empty" data-i18n="scanning"></div></div>
      <footer><span id="sync" data-i18n="connecting"></span><button id="sources" data-i18n="sources"></button></footer>
    </aside>
    <section id="detail"><div class="welcome"><span class="welcome-icon">⌘</span><h2 data-i18n="welcome"></h2><p data-i18n="welcomeHint"></p><div class="tags"><span>Codex</span><span>Claude Code</span><span>Hermes</span></div></div></section>
  </main>
  <div id="toast" role="status"></div>
  <dialog id="source-dialog"><h2 data-i18n="localSources"></h2><div id="source-content"></div><p data-i18n="sourceHint"></p><button id="close-dialog" data-i18n="close"></button></dialog>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
